name: Build_MSM8916_OpenWrt_25_12

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device'
        required: false
        type: choice
        default: uf02
        options:
          - uf02
          - uz801
      log_switch:
        description: "Build logs (verbose)"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/msm8916-openwrt-25.12.yml"
      - "config/**"
      - "scripts/**"
      - "feeds.conf.default"

env:
  CONFIG_FILE: "config/msm8916.config"
  REPO_URL: https://git.openwrt.org/openwrt/openwrt.git
  REPO_BRANCH: openwrt-25.12
  MSM8916_REPO: https://github.com/hkfuertes/msm8916-openwrt.git
  MSM8916_BRANCH: main
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  KEEP_RELEASES: 20
  KEEP_RELEASE_MARKER: "[keep-release]"
  CCACHE_DIR: /mnt/openwrt/ccache
  CCACHE_MAXSIZE: 5G
  TZ: Asia/Shanghai

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      openwrt_version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve latest stable OpenWrt 25.12.x tag
        id: resolve
        run: |
          VERSION=$(git ls-remote --tags https://git.openwrt.org/openwrt/openwrt.git 'v25.12.*' \
            | grep -oP 'v25\.12\.\d+$' | sort -V | tail -1)
          if [ -z "$VERSION" ]; then
            echo "WARNING: Could not resolve a stable OpenWrt 25.12.x version, falling back to branch openwrt-25.12"
            VERSION="openwrt-25.12"
          fi
          echo "Resolved OpenWrt version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build:
    needs: resolve-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true

      - name: Space usage check
        run: df -h

      - name: Setup environment dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: ${{ env.TZ }}
        run: |
          # Free disk space WITHOUT touching apt sources.
          # On ubuntu-24.04, the main Ubuntu apt repos live in /etc/apt/sources.list.d/ubuntu.sources,
          # so deleting that directory removes ALL standard packages (build-essential, gettext, ccache, etc.).
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

          # Make sure universe is enabled (mkbootimg lives there).
          sudo add-apt-repository -y universe || true

          sudo apt-get update
          sudo apt-get purge -y python3-distutils || true
          sudo apt-get autoremove -y
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            mkbootimg device-tree-compiler ccache

          if [[ -n "$TZ" ]]; then
            sudo timedatectl set-timezone "$TZ"
          fi
          echo "=== Tool versions ==="
          gcc --version | head -1
          clang --version | head -1
          ccache --version | head -1
          dtc --version || true
          command -v mkbootimg || echo "mkbootimg: NOT FOUND"

      - name: Ensure Python build tools
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install Unidecode

      - name: Clone OpenWrt source code (25.12.x)
        run: |
          OPENWRT_VERSION="${{ needs.resolve-version.outputs.openwrt_version }}"
          echo "Using OpenWrt version: $OPENWRT_VERSION"
          git clone "$REPO_URL" openwrt
          cd openwrt
          git checkout "$OPENWRT_VERSION"
          git log -1 --oneline

      - name: Clone MSM8916 patches and target files
        run: |
          git clone --depth 1 --branch "$MSM8916_BRANCH" "$MSM8916_REPO" msm8916-source
          ls -la msm8916-source/

      - name: Apply MSM8916 patches and load target
        run: |
          # Apply mac80211 patches using msm8916-openwrt's official script
          chmod +x msm8916-source/apply_patches.sh
          ./msm8916-source/apply_patches.sh openwrt

          # Move msm89xx target into OpenWrt
          if [ -d "msm8916-source/msm89xx" ]; then
            mv msm8916-source/msm89xx openwrt/target/linux/msm89xx
            echo "✅ Moved msm89xx target to openwrt/target/linux/"
          fi

          # Move msm8916 packages into OpenWrt
          if [ -d "msm8916-source/packages" ]; then
            mv msm8916-source/packages openwrt/package/msm8916
            echo "✅ Moved packages to openwrt/package/msm8916"
          fi

          # Verify
          ls -la openwrt/target/linux/msm89xx/ || echo "msm89xx target not found"
          ls -la openwrt/package/msm8916/ || echo "msm8916 packages not found"

      - name: Move build dirs to /mnt/openwrt
        run: |
          sudo mkdir -p /mnt/openwrt/{dl,staging_dir,build_dir,ccache}
          sudo chown -R "$USER:$(id -gn)" /mnt/openwrt
          rm -rf openwrt/dl openwrt/staging_dir openwrt/build_dir
          ln -sfn /mnt/openwrt/dl openwrt/dl
          ln -sfn /mnt/openwrt/staging_dir openwrt/staging_dir
          ln -sfn /mnt/openwrt/build_dir openwrt/build_dir
          df -h

      - name: Restore dl cache
        uses: actions/cache@v4
        with:
          path: /mnt/openwrt/dl
          key: ${{ runner.os }}-msm8916-${{ env.REPO_BRANCH }}-dl-${{ hashFiles('config/msm8916.config') }}
          restore-keys: |
            ${{ runner.os }}-msm8916-${{ env.REPO_BRANCH }}-dl-

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /mnt/openwrt/ccache
          key: ${{ runner.os }}-msm8916-${{ env.REPO_BRANCH }}-ccache-v2-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-msm8916-${{ env.REPO_BRANCH }}-ccache-v2-

      - name: Setup ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -s

      - name: Update & Install feeds
        working-directory: ./openwrt
        run: |
          rm -rf tmp
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f

      - name: Install third-party packages (homeproxy, passwall)
        working-directory: ./openwrt/package
        run: |
          chmod +x $GITHUB_WORKSPACE/scripts/update-packages.sh
          bash $GITHUB_WORKSPACE/scripts/update-packages.sh

      - name: Re-install feeds after third-party packages
        working-directory: ./openwrt
        run: |
          ./scripts/feeds install -a -f

      - name: Hotfix rust llvm CI option
        working-directory: ./openwrt
        run: |
          if [ -f feeds/packages/lang/rust/Makefile ]; then
            sed -i 's/--set=llvm.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/' feeds/packages/lang/rust/Makefile || true
            grep -n "download-ci-llvm" feeds/packages/lang/rust/Makefile || true
          fi

      - name: Copy configuration and defconfig
        run: |
          # Use msm8916-source diffconfig as base, then merge our config
          DEVICE="${{ inputs.device || 'uf02' }}"
          BASE_CONFIG="msm8916-source/diffconfig_${DEVICE}"

          if [ -f "$BASE_CONFIG" ]; then
            echo "Using base diffconfig: $BASE_CONFIG"
            cp -fv "$BASE_CONFIG" openwrt/.config
            # Append our additional packages (passwall, homeproxy, etc.)
            echo "" >> openwrt/.config
            echo "# Additional packages from config/msm8916.config" >> openwrt/.config
            cat "${CONFIG_FILE}" >> openwrt/.config
          else
            echo "WARNING: $BASE_CONFIG not found, using config/msm8916.config only"
            cp -fv "${CONFIG_FILE}" openwrt/.config
          fi

          cd openwrt && make defconfig
          [ -e .config ] && cp .config defconfig-final.config

      - name: Upload build config files
        uses: actions/upload-artifact@v4
        with:
          name: build-config-${{ inputs.device || 'uf02' }}
          path: |
            config/msm8916.config
            openwrt/defconfig-final.config

      - name: Download packages
        working-directory: ./openwrt
        run: |
          make download -j8 V=s
          find dl -size -1024c -exec rm -f {} \; || true

      - name: Compile OpenWrt firmware
        id: compile
        run: |
          cd openwrt
          echo "Disk usage before compile:"
          df -h
          set +e
          if [[ "${{ inputs.log_switch }}" == "true" ]]; then
            make -j1 V=s IGNORE_ERRORS=m
            rc=$?
          else
            make -j$(nproc) IGNORE_ERRORS=m
            rc=$?
          fi
          if [[ $rc -ne 0 ]]; then
            echo "::group::Build failed — re-running with -j1 V=s (no IGNORE_ERRORS) to surface real error"
            make -j1 V=s
            rc=$?
            echo "::endgroup::"
            echo "Compile failed, disk usage diagnostics:"
            df -h
            du -h -d1 . | sort -h | tail -n 30
            exit $rc
          fi
          set -e
          DEVICE_NAME=$(grep -o 'CONFIG_TARGET.*DEVICE_[^=]*=y' .config | head -1 | sed 's/.*DEVICE_\(.*\)=y/\1/')
          if [[ -n "$DEVICE_NAME" ]]; then
            echo "DEVICE_NAME=_${DEVICE_NAME}" >> "$GITHUB_ENV"
          fi
          echo "FILE_DATE=_$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"
          echo "status=success" >> $GITHUB_OUTPUT
          ccache -s || true

      - name: Save ccache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /mnt/openwrt/ccache
          key: ${{ runner.os }}-msm8916-${{ env.REPO_BRANCH }}-ccache-v2-${{ github.run_id }}

      - name: Prepare firmware artifacts path
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        if: env.UPLOAD_FIRMWARE == 'true'
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}_${{ needs.resolve-version.outputs.openwrt_version }}${{ env.FILE_DATE }}
          path: |
            ${{ env.FIRMWARE }}/openwrt-msm89xx-*-squashfs-gpt_both0.bin
            ${{ env.FIRMWARE }}/openwrt-msm89xx-*-squashfs-boot.img
            ${{ env.FIRMWARE }}/openwrt-msm89xx-*-squashfs-system.img
            ${{ env.FIRMWARE }}/openwrt-msm89xx-*.manifest
            ${{ env.FIRMWARE }}/openwrt-msm89xx-*-flash.sh
            ${{ env.FIRMWARE }}/openwrt-msm89xx-*-firmware.zip

      - name: Generate release tag and notes
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success'
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")-25.12" >> $GITHUB_OUTPUT
          cat <<EOF > release.txt
          🚀 OpenWrt firmware for MSM8916 devices (25.12 stable)
          ----------------------
          设备: ${{ inputs.device || 'uf02' }}
          构建时间: $(date +"%Y-%m-%d %H:%M")
          OpenWrt 版本: ${{ needs.resolve-version.outputs.openwrt_version }}
          OpenWrt 源码: $REPO_URL
          MSM8916 补丁: $MSM8916_REPO

          集成软件:
          - PassWall (代理工具)
          - HomeProxy (代理工具)
          - Xray-core
          - Argon 主题
          EOF

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success'
        with:
          tag: ${{ steps.tag.outputs.release_tag }}
          bodyFile: release.txt
          artifacts: |
            ${{ env.FIRMWARE }}/openwrt-msm89xx-*-squashfs-gpt_both0.bin
            ${{ env.FIRMWARE }}/openwrt-msm89xx-*-squashfs-boot.img
            ${{ env.FIRMWARE }}/openwrt-msm89xx-*-squashfs-system.img
            ${{ env.FIRMWARE }}/openwrt-msm89xx-*.manifest
            ${{ env.FIRMWARE }}/openwrt-msm89xx-*-flash.sh
            ${{ env.FIRMWARE }}/openwrt-msm89xx-*-firmware.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 7
          keep_minimum_runs: 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old GitHub Releases
        if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_RELEASES: ${{ env.KEEP_RELEASES }}
          KEEP_RELEASE_MARKER: ${{ env.KEEP_RELEASE_MARKER }}
        run: bash scripts/cleanup-old-releases.sh
